# ============================================================
# Pixelle-Studio Docker Compose
#
# Quick Start:
#   1. docker compose up -d
#   2. Open http://localhost:3000
#   3. Configure your API Key in Settings (top-right gear icon)
#
# Commands:
#   docker compose up -d          # Start all services in background
#   docker compose up              # Start all services in foreground
#   docker compose down            # Stop all services
#   docker compose logs -f         # View logs
#   docker compose logs -f backend # View backend logs only
#   docker compose up --build      # Rebuild and start
# ============================================================

services:
  # ========================
  # Backend - FastAPI + Python
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pixelle-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8001}:8001"
    environment:
      - DATABASE_URL=sqlite:////app/data/app.db
      - JWT_SECRET=${JWT_SECRET:-}
    volumes:
      # Persist SQLite database
      - backend-data:/app/data
      # Persist generated scripts/files
      - backend-scripts:/app/scripts
      # Persist user skills
      - backend-skills:/app/skills
      # Persist logs
      - backend-logs:/app/logs
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - pixelle-network

  # ========================
  # Frontend - Next.js
  # ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=${NEXT_PUBLIC_API_BASE:-http://localhost:8001/api}
        - NEXT_PUBLIC_WS_BASE=${NEXT_PUBLIC_WS_BASE:-ws://localhost:8001/ws}
    container_name: pixelle-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - pixelle-network

volumes:
  backend-data:
    driver: local
  backend-scripts:
    driver: local
  backend-skills:
    driver: local
  backend-logs:
    driver: local

networks:
  pixelle-network:
    driver: bridge

