version: '3.8'

services:
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: mcp-backend
    ports:
      - "8001:8001"
    volumes:
      # 挂载日志目录，方便查看日志
      - ./backend/logs:/app/logs
      # 挂载脚本目录，以便持久化生成的脚本
      - ./backend/scripts:/app/scripts
      # 挂载存储目录（数据库也放在这里）
      - ./backend/storage:/app/storage
    restart: unless-stopped
    environment:
      - LOG_LEVEL=INFO
      # 将数据库放在已挂载的 storage 目录中，避免直接挂载文件导致的问题
      - DATABASE_URL=sqlite:///./storage/app.db
    env_file:
      - .env

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_BASE=http://30.150.44.149:8001/api
        - NEXT_PUBLIC_WS_BASE=ws://30.150.44.149:8001/ws
    container_name: mcp-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      # 这里的 URL 需要是用户浏览器能访问到的地址
      # 如果是在服务器部署，填 http://<你的服务器IP>:8001/api
      - NEXT_PUBLIC_API_BASE=http://30.150.44.149:8001/api
      - NEXT_PUBLIC_WS_BASE=ws://30.150.44.149:8001/ws
    depends_on:
      - backend

