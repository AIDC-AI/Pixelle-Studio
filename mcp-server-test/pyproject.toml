[project]
name = "mcp-server-test"
version = "0.1.0"
description = "MCP Server for Social Media Video Generation Tools"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp",
    "pydantic",
    "pandas",
    "openpyxl",
    "matplotlib",
    "requests"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
